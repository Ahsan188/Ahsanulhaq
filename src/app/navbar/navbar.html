
<nav class="navbar">
  <a routerLink="/" class="logo">Portfolio<span>.</span></a>

  <button class="menu-toggle" (click)="menuOpen = !menuOpen">
    ☰
  </button>

  <!-- Navigation Links -->
  <ul [class.active]="menuOpen">
    <li *ngFor="let item of navLinks">
      <a
        [routerLink]="item.link"
        (click)="menuOpen = false">
        {{ item.name }}
      </a>
    </li>
  </ul>
</nav>
